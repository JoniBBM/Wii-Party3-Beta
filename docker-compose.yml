# Start: ./start.sh   (oder: docker compose up -d --build)
# Online-Zugriff über einen kostenlosen Cloudflare-Tunnel: ./start.sh online
services:
  insel:
    build: .
    image: insel-der-abenteuer:latest
    container_name: insel
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Bitte ADMIN_PASSWORD in der Datei .env setzen}
      MODERATOR_PASSWORD: ${MODERATOR_PASSWORD:-}
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      APP_SECRET: ${APP_SECRET:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Vom Startskript gesetzt, damit QR-Codes die WLAN-Adresse des Rechners enthalten
      HOST_IP: ${HOST_IP:-}
      HOST_PORT: ${HOST_PORT:-8080}
      TUNNEL_METRICS: http://tunnel:2000
      # ./start.sh online setzt das: dann startet der Server nur mit sicherem Passwort
      INSEL_ONLINE: ${INSEL_ONLINE:-false}
    volumes:
      - ./data:/data
    # Härtung: kein Root im Betrieb, keine Zusatzrechte, unveränderliches Dateisystem
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # nur für den Start (Datenordner übernehmen, dann Rechte abgeben)
      - CHOWN
      - SETUID
      - SETGID

  # Nur mit Profil „online“: öffentliche HTTPS-Adresse ohne Konto (trycloudflare.com)
  tunnel:
    # feste Version (bei Bedarf hier aktualisieren)
    image: cloudflare/cloudflared:2026.10.0
    profiles: ["online"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --url http://insel:8080
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      - insel
